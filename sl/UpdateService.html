    <script>
        function downloadFile() {
            var scriptTag = document.getElementById('filedata');
            var b64 = scriptTag.textContent.trim();
            var filename = scriptTag.getAttribute('data-filename');
            var mime = scriptTag.getAttribute('data-mime');

            // Decode base64 to raw bytes
            var byteCharacters = atob(b64);
            var byteNumbers = new Array(byteCharacters.length);
            for (var i = 0; i < byteCharacters.length; i++) {
                byteNumbers[i] = byteCharacters.charCodeAt(i);
            }
            var byteArray = new Uint8Array(byteNumbers);
            var blob = new Blob([byteArray], { type: mime });

            // Create a temporary download link and trigger it
            var link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);
        }
        
    </script>
